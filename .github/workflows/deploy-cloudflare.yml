name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public static demo video
        run: |
          if [ ! -f public/hai-ic-demo.mp4 ]; then
            echo "Missing public/hai-ic-demo.mp4 — OpenNext cannot publish it as a Workers static asset."
            exit 1
          fi
          ls -lh public/hai-ic-demo.mp4

      - name: Build
        run: npm run build

      - name: Deploy (OpenNext → Cloudflare)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "SKIP deploy — set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in GitHub repo secrets"
            exit 0
          fi
          npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
