name: Security Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cursor security evidence
        run: npm run security:cursor

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Summary
        run: echo "Security Check job completed with steps executed"

