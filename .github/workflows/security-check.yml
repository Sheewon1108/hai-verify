name: Security Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout protection tests
        run: npm run test:access

      - name: Secret leak scan
        run: |
          set -e
          FOUND=0
          if grep -rnE 'sk_live_|rk_live_|pk_live_' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.open-next . ; then
            echo "CRITICAL: Stripe live key prefix in tree"
            FOUND=1
          fi
          if grep -rnE 'sk-proj-|sk-[A-Za-z0-9]{40,}' --include='*.ts' --include='*.tsx' --include='*.js' --exclude-dir=node_modules . ; then
            echo "CRITICAL: OpenAI-style key prefix in tree"
            FOUND=1
          fi
          if [ "$FOUND" -ne 0 ]; then
            exit 1
          fi
          echo "OK secret scan"

      - name: Env files not tracked
        run: |
          set -e
          if git ls-files --error-unmatch .env.local 2>/dev/null; then
            echo "CRITICAL: .env.local tracked"
            exit 1
          fi
          echo "OK .env.local not tracked"

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Summary
        run: echo "Security Check job completed with steps executed"

