name: Unapproved important file reminder

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Send hourly reminder if an important open file is still unapproved
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_ACCOUNT_EMAIL: ${{ secrets.RESEND_ACCOUNT_EMAIL }}
          RESEND_DOMAIN_VERIFIED: ${{ vars.RESEND_DOMAIN_VERIFIED }}
          HAI_REMINDER_EMAIL: ${{ vars.HAI_REMINDER_EMAIL }}
          HAI_INTERNAL_API_KEY: ${{ secrets.HAI_INTERNAL_API_KEY }}
        run: node scripts/send-unapproved-file-reminder.mjs
